<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TACOS — Team Allocation & Candidate Optimization System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===================== HEADER ===================== -->
<header>
  <div class="logo">
    <img src="taco.png" alt="TACOS Logo" class="logo-img" />
    <span>TACOS</span>
  </div>
  <div class="tagline">Team Allocation &amp; Candidate Optimization System</div>
</header>

<!-- ===================== MAIN ===================== -->
<main>

  <!-- ---------- PROJECT SETUP PANEL ---------- -->
  <section class="card" id="setup-panel">
    <h2>Project Setup</h2>

    <div class="form-row">
      <label for="project-name">Project Name</label>
      <input type="text" id="project-name" placeholder="e.g. AI Platform" />
    </div>

    <div class="form-row two-col">
      <div>
        <label for="team-size">Team Size</label>
        <input type="number" id="team-size" min="1" max="20" value="5" />
      </div>
      <div>
        <label>Importance</label>
        <div class="star-row" id="star-row">
          <span class="star active" data-val="1">★</span>
          <span class="star active" data-val="2">★</span>
          <span class="star active" data-val="3">★</span>
          <span class="star active" data-val="4">★</span>
          <span class="star active" data-val="5">★</span>
        </div>
        <input type="hidden" id="importance" value="5" />
      </div>
    </div>

    <div class="form-row">
      <label>Required Skills</label>
      <div id="skills-container"></div>
      <button class="btn-secondary" id="add-skill-btn">+ Add Skill</button>
    </div>

    <div class="form-row" id="mvp-row" style="display:none">
      <label for="mvp-select">MVP Skill</label>
      <select id="mvp-select"></select>
    </div>

    <button class="btn-primary" id="build-btn">🚀 BUILD TEAM</button>
    <div id="loading" class="loading hidden">Analyzing employee database…</div>
  </section>

  <!-- ---------- RESULTS PANEL ---------- -->
  <section class="card hidden" id="results-panel">
    <h2>Recommended Team</h2>
    <div id="results-content"></div>
  </section>

</main>

<!-- ===================== FOOTER ===================== -->
<footer>Built with TACOS algorithm · Powered by skill &amp; chemistry</footer>

<script src="app.js"></script>
</body>
</html>
